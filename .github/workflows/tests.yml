name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Byte-compile the package
        run: python -m compileall -q nginxpanel tests
      - name: ShellCheck install.sh
        run: shellcheck install.sh
      - name: install.sh is executable
        run: test -x install.sh

  unit:
    name: Unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    env:
      # GitHub images may ship nginx: keep this job independent of it.
      NP_NGINX_BIN: nginx-not-installed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest

  nginx:
    name: Tests with real nginx (nginx -t)
    runs-on: ubuntu-24.04
    env:
      NP_REQUIRE_NGINX: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install nginx and the stream module
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q nginx libnginx-mod-stream
          # nginx -t binds the listen ports: free them and allow binding < 1024 without root
          sudo systemctl stop nginx || true
          sudo setcap cap_net_bind_service=+ep "$(command -v nginx)"
          nginx -V
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest

  install:
    name: install.sh on a fresh Ubuntu
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run the installer
        run: sudo ./install.sh --with-nginx --bind 127.0.0.1 | tee install.log
      - name: Panel service is up
        run: |
          systemctl is-active nginx-panel
          for i in $(seq 30); do curl -sf -o /dev/null http://127.0.0.1:8181/login && break; sleep 1; done
          curl -sf http://127.0.0.1:8181/login | grep -q "Sign in"
      - name: Log in with the generated admin password
        run: |
          PW=$(sed -n 's/.*Password: \([^ ]*\) .*/\1/p' install.log)
          test -n "$PW"
          TOKEN=$(curl -s -c jar http://127.0.0.1:8181/login | sed -n 's/.*name="csrf-token" content="\([^"]*\)".*/\1/p')
          code=$(curl -s -b jar -c jar -o /dev/null -w '%{http_code}' --data-urlencode "_csrf=$TOKEN" \
                 --data-urlencode username=admin --data-urlencode "password=$PW" http://127.0.0.1:8181/login)
          test "$code" = 302
          curl -sf -b jar http://127.0.0.1:8181/system | grep -q "Take control of nginx"
      - name: Take control of nginx
        run: |
          sudo nginx-panel apply
          sudo nginx -t
          grep -q "Generated by nginx-panel" /etc/nginx/nginx.conf
          test -f /etc/nginx/nginx.conf.panel-orig
          systemctl is-active nginx
      - name: Unknown domains get no response (444)
        run: |
          rc=0; curl -s -o /dev/null -H "Host: unknown.example" http://127.0.0.1/ || rc=$?
          echo "curl exit code: $rc"
          # 52 = empty reply, 56 = connection reset: both mean nginx closed without responding
          [ "$rc" = 52 ] || [ "$rc" = 56 ]
      - name: Re-running the installer keeps existing users
        run: |
          sudo ./install.sh --bind 127.0.0.1 | tee reinstall.log
          grep -q "Existing users kept" reinstall.log
          if grep -q "Password:" reinstall.log; then echo "admin password was reset"; exit 1; fi
      - name: Diagnostics
        if: failure()
        run: |
          sudo journalctl -u nginx-panel --no-pager -n 100 || true
          sudo journalctl -u nginx --no-pager -n 50 || true
          sudo tail -n 50 /var/log/nginx/panel/error.log /var/log/nginx/error.log || true
