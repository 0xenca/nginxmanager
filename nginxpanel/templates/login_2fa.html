{% extends "base.html" %}
{% block bodyclass %}auth{% endblock %}
{% block title %}Verificación{% endblock %}
{% block content %}
<form method="post" class="authcard">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <div class="brand"><span>Verificación en dos pasos</span></div>
  <p class="muted">Introduce el código de 6 dígitos de tu app de autenticación.</p>
  <label for="c">Código</label><input type="text" id="c" name="code" inputmode="numeric" pattern="[0-9 ]{6,7}" autocomplete="one-time-code" autofocus required>
  <button class="btn primary">Verificar</button>
</form>
{% endblock %}
