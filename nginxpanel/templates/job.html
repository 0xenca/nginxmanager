{% extends "base.html" %}
{% block title %}Job{% endblock %}
{% block content %}
<div class="head"><div><h1>{{ j.title }}</h1>
<p>Started {{ j.started|dt('%Y-%m-%d %H:%M:%S') }} · <span id="jobstatus" class="tag {{ 'ok' if j.status == 'ok' else ('warn' if j.status == 'running' else 'err') }}">{{ {'running':'Running…','ok':'Completed','error':'Failed'}[j.status] }}</span></p></div>
<div id="jobdone" {{ 'hidden' if j.status == 'running' }} class="actions"><a class="btn" href="{{ url_for('main.certs') }}">Certificates</a><a class="btn" href="{{ url_for('main.system') }}">System</a></div></div>
<pre class="code log" id="joblog" data-status="{{ j.status }}" data-url="{{ url_for('main.job', jid=j.id, format='json') }}">{{ j.log }}</pre>
{% endblock %}
